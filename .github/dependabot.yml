version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-dependencies:
        patterns:
          - '*'
